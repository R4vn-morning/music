name: Build APK from zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q R4VnMusic.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: R4VnMusic
        run: gradle assembleDebug --stacktrace

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp R4VnMusic/app/build/outputs/apk/debug/app-debug.apk R4VnMusic-debug.apk
          gh release create "build-${{ github.run_number }}" R4VnMusic-debug.apk \
            --repo "${{ github.repository }}" \
            --title "R4Vn Music debug build ${{ github.run_number }}" \
            --notes "Debug APK built from R4VnMusic.zip"
