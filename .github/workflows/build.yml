name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project description
        run: |
          cat > code.md <<'EOF_CODE_MD'
          # کد کامل پروژه موزیک پلیر
          هر بخش یک فایل است؛ مسیر فایل در عنوان آمده. همان مسیرها را در Android Studio بسازید.


          ## README.md

          ```markdown
          # موزیک پلیر اندروید

          پخش‌کننده‌ی موسیقی آفلاین با Kotlin، Jetpack Compose و Media3.

          ## امکانات
          - نمایش همه‌ی آهنگ‌های گوشی (از MediaStore) با کاور آلبوم
          - جستجوی آهنگ و خواننده
          - پخش در پس‌زمینه با نوتیفیکیشن و کنترل در صفحه قفل
          - مینی‌پلیر پایین صفحه و صفحه‌ی کامل پخش
          - بعدی / قبلی، نوار پیشرفت قابل کشیدن، پخش تصادفی، تکرار (همه / یکی)
          - رابط راست‌به‌چپ، تم روشن/تاریک و رنگ‌های داینامیک (اندروید ۱۲+)

          ## اجرا
          1. پوشه‌ی پروژه را در Android Studio (نسخه‌ی Koala یا جدیدتر) باز کنید.
          2. صبر کنید Gradle Sync تمام شود.
          3. روی گوشی یا شبیه‌ساز (API 24 به بالا) اجرا کنید. روی شبیه‌ساز باید چند فایل mp3 به حافظه اضافه کنید.
          4. در اولین اجرا دسترسی فایل‌های صوتی و نوتیفیکیشن را تأیید کنید.

          برای ساخت APK: `Build > Build Bundle(s) / APK(s) > Build APK(s)`

          ## ساختار
          - `MusicRepository.kt` خواندن آهنگ‌ها از حافظه
          - `PlaybackService.kt` سرویس پخش (ExoPlayer + MediaSession)
          - `PlayerViewModel.kt` وضعیت و کنترل پخش
          - `ui/` صفحه‌ها و کامپوننت‌ها

          ```


