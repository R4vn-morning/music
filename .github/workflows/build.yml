          package com.example.musicplayer.ui

          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.MusicNote
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import android.net.Uri
          import android.graphics.BitmapFactory
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          /** نمایش کاور آلبوم؛ اگر کاور نبود آیکون نت موسیقی نشان داده می‌شود. */
          @Composable
          fun AlbumArt(uri: Uri?, size: Dp, modifier: Modifier = Modifier) {
              val context = LocalContext.current
              var bitmap by remember(uri) { mutableStateOf<ImageBitmap?>(null) }

              LaunchedEffect(uri) {
                  bitmap = if (uri == null) null else withContext(Dispatchers.IO) {
                      try {
                          context.contentResolver.openInputStream(uri)?.use {
                              BitmapFactory.decodeStream(it)?.asImageBitmap()
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }
              }

              Box(
                  modifier = modifier
                      .size(size)
                      .clip(RoundedCornerShape(size / 8))
                      .background(MaterialTheme.colorScheme.secondaryContainer),
                  contentAlignment = Alignment.Center
              ) {
                  val bmp = bitmap
                  if (bmp != null) {
                      Image(
                          bitmap = bmp,
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.size(size)
                      )
                  } else {
                      Icon(
                          Icons.Filled.MusicNote,
                          contentDescription = null,
                          modifier = Modifier.size(size / 2),
                          tint = MaterialTheme.colorScheme.onSecondaryContainer
                      )
                  }
              }
          }

          fun formatTime(ms: Long): String {
              val totalSec = (ms.coerceAtLeast(0) / 1000).toInt()
              return "%d:%02d".format(totalSec / 60, totalSec % 60)
          }

